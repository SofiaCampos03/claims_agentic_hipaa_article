    - oral
    - vision
    - pharmacy
  
  claim_day_of_week:
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
    - saturday
    - sunday
  age_range:
    - "0-5"
    - "6-9"
    - "10-19"
    - "20-29"
    - "30-39"
    - "40-49"
    - "50-64"
    - "65+"
  insurer_name: []   # levels learned from data/claim_metrics.csv

binned:
