binary:
  - no_pre_auth_flag
  - pre_auth_denied_flag
  - patient_high_denial_120d

text_columns:
  - diagnosis_codes
  - medication_codes
  - procedure_codes

# Preprocessing pipeline (XGBoost path)
pipeline:
  # 1. Decimal/money columns -> float64 (claim_total also stripped of $ , symbols)
  - op: clean_decimal
    columns: numerical.feature_groups.decimal_columns
    strip_non_numeric: [claim_total]
    fillna: 0.0

  # 2. Matched/unmatched medication-diagnosis indicator from its count column
  - op: indicator_from_count
    count_column: unmatched_medication_diagnosis_count
    positive_target: unmatched_medication_diagnosis
    complement_target: matched_medication_diagnosis
    default_positive: 0
    default_complement: 1

  # 3. claim_month integer -> month name (unmapped -> "missing")
  - op: map_values
    column: claim_month
    fillna: missing
    mapping:
      1: january
      2: february
      3: march
      4: april
      5: may
      6: june
      7: july
      8: august
      9: september
      10: october
      11: november
      12: december

  # 4. claim_day_of_week integer -> weekday name (unmapped -> "missing")
  - op: map_values
    column: claim_day_of_week
    numeric_coerce: true
    fillna: missing
    mapping:
      0: sunday
      1: monday
      2: tuesday
      3: wednesday
      4: thursday
      5: friday
      6: saturday

  # 5-6. Interval columns -> days
  - op: timedelta_to_unit
    source: bureaucracy_time
    target: bureaucracy_time_days
    unit: days
    write_back_source: true
    fillna: 0.0
  - op: timedelta_to_unit
    source: processing_time
    target: processing_time_days
    unit: days
    write_back_source: true
    fillna: 0.0

  # 7. diagnosis_vitals_ratio: IQR clip, force 0 when vitals_count == 0
  - op: clip_iqr
    column: diagnosis_vitals_ratio
    iqr_multiplier: 1.5
    zero_when_zero: vitals_count
    fillna: 0.0

  # 8. claim_total final strip + numeric coercion
  - op: clean_decimal
    columns: [claim_total]
    strip_non_numeric: [claim_total]
    fillna: 0.0

  # 9. Box-Cox (+ IQR clip) on skewed numerics — fitted on training data only
  - op: boxcox_clip
    columns: numerical.feature_groups.boxcox_features
    iqr_multiplier: 1.5
    skew_threshold: 0.75
    eps: 1.0e-6

  # 10. claim_total -> percentile bin (quartile edges)
  - op: percentile_bin
    column: claim_total
    bin: claim_total_bin
    use_quartiles: true

  # 11. insurer_claim_volume -> percentile bin (quartile edges)
  - op: percentile_bin
    column: insurer_claim_volume
    bin: insurer_claim_volume_bin
    use_quartiles: true

  # 12. claim_total_per_diagnosis = claim_total / diagnosis_count, then bin
  - op: ratio
    numerator: claim_total
    denominator: diagnosis_count
    target: claim_total_per_diagnosis
    on_zero_denominator: one
  - op: percentile_bin
    column: claim_total_per_diagnosis
    bin: claim_total_per_diagnosis_bin

  # 13. Percentile-bin each rejection-rate feature that has a matching *_bin entry
  - op: percentile_bin_group
    columns: numerical.feature_groups.rejection_rate_features
    bin_suffix: _bin

  # 14. processing_time_days -> percentile bin
  - op: percentile_bin
    column: processing_time_days
    bin: processing_time_days_bin

  # 15. Multi-hot encode the code-array columns (numerical.derived.multi_hot)
  - op: multi_hot

  # 16. Coerce active numericals -> float, fill NaN with 0
  - op: coerce_numeric
    columns: numerical.active
    fillna: 0.0

  # 17. procedures_per_diagnosis = number_of_procedures / diagnosis_count (only if absent)
  - op: ratio
    numerator: number_of_procedures
    denominator: diagnosis_count
    target: procedures_per_diagnosis
    on_zero_denominator: one
    coerce_numerator: true
    numerator_fillna: 0.0
    astype_float: true
    skip_if_present: true

  # 18. Coerce binary flags -> int (0/1), creating any missing as 0
  - op: coerce_binary
    columns: binary
