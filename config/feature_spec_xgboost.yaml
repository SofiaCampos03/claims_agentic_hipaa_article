# Feature spec for the claim-denial XGBoost model (claims_agentic_framework.ipynb).
#   numerical.active   -> continuous model features (skewed ones Box-Cox'd, all standardised)
#   numerical.inactive -> available columns deliberately NOT used (leakage / redundancy)
#   categorical        -> one-hot encoded; levels are learned from the training data
#   binned             -> fixed-edge bins, one-hot encoded
#   binary             -> 0/1 flags derived from the raw columns
#   bureaucracy_time_days is used as a continuous feature (no binning).
numerical:
  active:
    - patient_claim_count
    - patient_avg_claim_total
    - insurer_avg_claim_total
    - claim_total
    - bureaucracy_time_days
    #- processing_time_days

  inactive:
    - processing_time_days
    - number_of_procedures
    - number_of_medication
    - diagnosis_vitals_ratio
    - medication_diagnosis_ratio
    - procedures_per_diagnosis
    - similar_denial_ratio
    - diagnosis_count
    - claim_total_vs_insurer_avg_ratio
    - vitals_count
    - claim_total_per_diagnosis
    # Moved to inactive to prevent data leakage
    - patient_rejection_ratio
    - patient_rejection_ratio_30d
    - patient_rejection_ratio_60d
    - patient_rejection_ratio_90d
    - patient_rejection_ratio_120d
    # Short-term insurer rejection rates causing model dominance and potential data leakage
    - insurer_rejection_rate
    - insurer_rejection_rate_30d
    - insurer_rejection_rate_60d
    - insurer_rejection_rate_90d
    - insurer_rejection_rate_120d
  derived:
    multi_hot:
      diagnosis:
        column: diagnosis_codes
        prefix: diagnosis_codes
        max_codes: 50
        min_df: 10
      medication:
        column: medication_codes
        prefix: medication_code
        max_codes: 50
        min_df: 10
      procedure:
        column: procedure_codes
        prefix: procedure_code
        max_codes: 50
        min_df: 10
  feature_groups:
    rejection_rate_features:
      - patient_rejection_ratio_120d
      #- insurer_rejection_rate_90d
      #- insurer_rejection_rate_120d
      #- insurer_complaint_rejection_rate_120d
      #- insurer_gender_complaint_rejection_rate_120d
      #- insurer_age_complaint_rejection_rate_120d
    boxcox_features:
      - number_of_procedures
      - patient_avg_claim_total
      - insurer_avg_claim_total
    decimal_columns:
      - claim_total
      - patient_avg_claim_total
      - insurer_avg_claim_total
      - patient_rejection_ratio_120d
      #- insurer_rejection_rate_90d
      #- insurer_rejection_rate_120d
      - insurer_complaint_rejection_rate_120d
      #- insurer_gender_complaint_rejection_rate_120d
      #- insurer_age_complaint_rejection_rate_120d

categorical:
  gender:
    - F
    - M
  has_pre_auth:
    - yes
    - no
  was_pre_auth_approved:
    - yes
    - no
  claim_month:
    - january
